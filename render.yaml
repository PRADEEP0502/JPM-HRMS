services:
  - type: web
    name: jpm-hrms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --worker-class gthread --timeout 120
    envVars:
      - key: MONGO_URI
        sync: false
